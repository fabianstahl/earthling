[project]
name = "earthling"
version = "0.1.0"
description = "Cinematic 3D flyover videos of GPS tracks"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "moderngl>=5.12.0",
    "numpy>=2.5.3",
    "pydantic>=2.13.5",
    "pyglm>=2.8.3",
    "PyQt6>=6.7",
    "tzdata>=2026.4",
]

[project.scripts]
earthling = "earthling.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-qt>=4.4",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/earthling"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM"]
ignore = ["N802"]  # Qt overrides use camelCase

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyqt6"
