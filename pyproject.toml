[project]
name = "earthling"
version = "0.1.0"
description = "Cinematic 3D flyover videos of GPS tracks"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "gpxpy>=1.6.2",
    "httpx>=0.28.1",
    "imageio-ffmpeg>=0.6.0",
    "moderngl>=5.12.0",
    "numpy>=2.5.3",
    "pillow>=12.3.0",
    "pydantic>=2.13.5",
    "pyglm>=2.8.3",
    "pyproj>=3.8.0",
    "PyQt6>=6.7",
    "rasterio>=1.5.1",
    "shapely>=2.1.2",
    "tzdata>=2026.4",
    "tzfpy>=2.1.0",
]

[project.scripts]
earthling = "earthling.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=7.1.0",
    "pytest-qt>=4.4",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/earthling"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM"]
ignore = ["N802"]  # Qt overrides use camelCase

[tool.ruff.lint.per-file-ignores]
# scene scripts: long keyframe tables read better on one line
"examples/showcase/tools/*" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
qt_api = "pyqt6"
filterwarnings = ["ignore::PendingDeprecationWarning:rasterio.*"]
markers = ["slow: chained workflows and scaling checks (pytest -m slow, ~10 min, offline)"]
addopts = "-m 'not slow'"  # (`-m slow` on the command line replaces it)

[tool.coverage.run]
source = ["earthling"]
branch = true

[tool.coverage.report]
skip_covered = true
sort = "cover"
